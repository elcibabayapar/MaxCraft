[Minecraft]
; 1: MaxCraft starts Minecraft itself (portable Prism under %LOCALAPPDATA%\SkyCraft).
; 0: start it yourself - the game runs, nothing Minecraft-side happens.
bStartWithGame = 1
; Empty: use the bundled MaxCraft\SkyCraft-Minecraft.zip.
; Otherwise a path to your own Prism launcher.
sLauncher =
sArguments = --launch SkyCraft

[World]
; MP2 units per Minecraft block. 1 unit = 1 block (MaxFX works in metres), 1.8 blocks = Max's
; own height. > 0 is used as given; 0 measures Max's collision capsule and fits 1.8 blocks to it,
; which is the setting to try first if the world looks the wrong size.
fUnitsPerBlock = 0
; Which of MP2's axes points up. 0 x, 1 y, 2 z. -1: from Max's capsule.
iUpAxis = -1
; MP2 is left-handed (Direct3D). 0 if the world looks mirrored.
bFlipZ = 1
; MP2 units from the character's origin down to the feet. Raise if Max floats or sinks.
fFeetOffset = 0
; Which row of an MP2 transform is "forward". Try 0 or 1 if the camera looks sideways.
iForwardRow = 2
; Minecraft's time of day, in hours. MP2 has no clock.
fGameHour = 12
; First person: Max's body this many blocks behind the eye, so it is not inside the camera.
fBodyBehind = 0.7
; Move MP2's own render camera to Minecraft's eye. Needed for rooms and camera-based effects.
bMoveRenderCamera = 1

[Combat]
; Minecraft damage / 20 of an enemy's full health, times this.
fEnemyDamageScale = 1.5
; MP2 damage to Max, as a fraction of his health, into Minecraft hearts.
fPlayerDamageScale = 1.0

[Controls]
; DirectInput scan codes. MP2 receives each under the name in the comment.
iBulletTimeKey = 0x30           ; B: held -> MP2's bullet time (its right mouse button)
iQuickSaveKey = 0x40            ; F6 -> MP2's quicksave (F5, which is Minecraft's camera key)
iWeaponModeKey = 0x2F           ; V: toggles MP2 weapon mode (mouse buttons, wheel, 1-9 and R go to MP2)
iUseKey = 0x22                  ; G -> MP2's E (its action key: doors, switches); E is Minecraft's inventory

[Debug]
; Extra per-hit and per-room logging.
bDiagnostics = 0
; 1: draw Minecraft's blocks over everything, ignoring MP2's depth. Diagnostic only.
bBlocksNoDepth = 0
; 1: draw the blocks untextured (vertex colour only), to tell a texture problem from a transform one.
bBlocksNoTexture = 0
; Which moment of MP2's frame the blocks are drawn in. 0: just before MP2 clears its depth buffer
; for its weapon, else at the end of its 3D scene, else at Present. 1: only at the end of the 3D
; scene. Both draw from the world camera and let MP2's walls occlude the blocks.
bDrawAtEndScene = 0

; DIAGNOSTICS for the menu-to-3D crash. Leave these at 0 for normal play.
; bNoRenderHooks = 1 installs no D3D8 hook at all: movement, collision and combat work, but nothing
;   of Minecraft is drawn. This is the switch that tells "the crash is in the render path" from
;   "it is not".
; bNoViewFixup = 1 passes SetTransform through (the camera stops following Minecraft's eye).
; bNoWvpFixup  = 1 passes SetVertexShaderConstant through (Max's model keeps MP2's own matrices).
; bNoBlockDraw = 1 draws no Minecraft blocks at all.
; Each one says itself once in MaxCraft.log.
bNoRenderHooks = 0
bNoViewFixup = 0
bNoWvpFixup = 0
bNoBlockDraw = 0