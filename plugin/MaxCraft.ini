; MaxCraft settings. Lives next to maxpayne2.exe.

[Minecraft]
bStartWithGame = 1              ; 0: start Minecraft yourself
sLauncher =                     ; empty: MaxCraft\SkyCraft-Minecraft.zip (SkyCraft's Prism + instance)
sArguments = --launch SkyCraft  ; what your launcher needs to start the instance

[World]
fUnitsPerBlock = 1              ; MP2 units per Minecraft block (MaxFX uses metres)
iUpAxis = -1                    ; MP2's up axis (0 x, 1 y, 2 z); -1: from Max's capsule
bFlipZ = 1                      ; 1: MP2 is left-handed (Direct3D). Try 0 if the world is mirrored
fFeetOffset = 0                 ; MP2 units from a character's origin down to its feet
iForwardRow = 2                 ; row of an MP2 transform that points forward (0, 1 or 2)
fGameHour = 12                  ; Minecraft's time of day
fBodyBehind = 0.7               ; first person: Max's body this many blocks behind the camera

[Combat]
fEnemyDamageScale = 1.5         ; Minecraft damage, as 1/20ths of an enemy's health, times this
fPlayerDamageScale = 1.0        ; damage to Max (fraction of his health) -> Minecraft hearts, times this

[Controls]
iBulletTimeKey = 0x30           ; DirectInput key (B): MP2's bullet time while held
iQuickSaveKey = 0x40            ; DirectInput key (F6): MP2's quicksave (F5 is Minecraft's camera)
iUseKey = 0x12                  ; DirectInput key (E): stays MP2's action key (doors, switches)
iInventoryKey = 0x17            ; DirectInput key (I): Minecraft receives it as E (its inventory)

[Debug]
bDiagnostics = 0                ; detailed logs in MaxCraft.log
bBlocksNoDepth = 0              ; draw Minecraft's blocks over everything (no occlusion)
bBlocksNoTexture = 0            ; draw blocks untextured (vertex colour): isolates texture problems
bDrawAtEndScene = 0             ; draw blocks inside MP2's 3D scene (EndScene) instead of at Present
